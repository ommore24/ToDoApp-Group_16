
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ToDo App{% endblock %}</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <!-- Website Branding -->
            <a class="brand" href="/">
                <b>✓</b> ToDo App
            </a>

            <small class="nav-label">WORKSPACE</small>

            <!-- Dynamic Navigation -->
            <nav id="sideNav"></nav>

            <!-- User Profile -->
            <div class="profile">

                <span id="avatar">U</span>

                <div>
                    <strong id="sideName">Loading…</strong>
                    <small id="sideRole">Account</small>
                </div>

            </div>

        </aside>

        <!-- Main Content -->
        <main class="main">

            <!-- Top Navigation -->
            <header class="topbar">

                <span>
                    Workspace /
                    <span id="crumb">Overview</span>
                </span>

                <button id="logoutButton">
                    Log out ↗
                </button>

            </header>

            <!-- Global Error Message -->
            <p id="globalError" class="error hidden"></p>

            <!-- Individual Page Content -->
            {% block content %}
            {% endblock %}

        </main>

    </div>

    <!-- Common JavaScript -->
    <script src="{{ url_for('static', filename='js/common.js') }}" defer></script>

    <!-- Page-specific JavaScript -->
    {% block scripts %}
    {% endblock %}

</body>
</html>
