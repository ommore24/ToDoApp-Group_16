{% extends "base.html" %}
{% block title %}Register | TaskFlow{% endblock %}

{% block auth_content %}
<div class="auth-wrap">
    <section class="auth-card">

        <a class="brand centered" href="{{ url_for('auth.login') }}">
            <span class="brand-mark">✓</span>
            <span>TaskFlow</span>
        </a>

        <p class="eyebrow">GET STARTED</p>
        <h1>Create account</h1>
        <p class="muted">Set up your personal productivity workspace.</p>

        <div id="authError" class="alert error hidden"></div>

        <form id="registerForm" class="task-form" method="POST" action="{{ url_for('auth.register') }}">

            <label>Full name
                <input id="name" type="text" name="name" required placeholder="Your name" autocomplete="name">
            </label>

            <label>Email address
                <input id="email" type="email" name="email" required placeholder="you@example.com" autocomplete="email">
            </label>

            <label>Password
                <input id="password" type="password" name="password" required minlength="8"
                    placeholder="Create a password" autocomplete="new-password">
            </label>

            <label>Confirm password
                <input id="confirmPassword" type="password" name="confirmPassword" required minlength="8"
                    placeholder="Confirm your password" autocomplete="new-password">
            </label>

            <button type="submit" class="button primary full-width">
                Create account
            </button>

        </form>

        <p class="auth-foot">
            Already registered?
            <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>

    </section>
</div>
{% endblock %}
